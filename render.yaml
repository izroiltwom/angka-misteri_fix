services:
  - type: web
    name: angka-misteri
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DISCONNECT_GRACE_MS
        value: "60000"
      - key: ROOM_TTL_MS
        value: "7200000"
